name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Least privilege: the job needs to read the repo and publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a cancelled deploy can leave Pages on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock have drifted.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # next.config.ts sets `output: "export"`, so the static site lands in out/.
      # GitHub Pages would otherwise run the output through Jekyll, which strips
      # files and directories beginning with an underscore — including Next's
      # _next/ bundle directory.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
