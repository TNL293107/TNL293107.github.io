<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trần Nhất Long">
  <!-- Cobalt ground: reads on both light and dark browser chrome, and matches
       the site accent. The letterform is drawn as rects, not text, so it does
       not depend on a font being available to the tab renderer. -->
  <rect width="64" height="64" rx="14" fill="#2440e0"/>
  <g fill="#fdf8f3">
    <rect x="16" y="15" width="20" height="5"/>   <!-- top serif -->
    <rect x="22" y="15" width="8"  height="32"/>  <!-- stem      -->
    <rect x="22" y="41" width="26" height="6"/>   <!-- foot      -->
    <rect x="44" y="37" width="4"  height="10"/>  <!-- foot tick -->
  </g>
</svg>
